<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>API Documentation | Logmaxing</title>
		<style>
			body {
				margin: 0;
				padding: 0;
			}
		</style>
	</head>
	<body>
		<div
			id="api-reference"
			data-url="/api/openapi.json"
			data-configuration='{"theme":"purple","layout":"modern","darkMode":true,"hideDarkModeToggle":false,"showSidebar":true,"hideDownloadButton":false,"hideModels":false,"hideClientButton":false,"defaultHttpClient":{"targetKey":"javascript","clientKey":"fetch"},"metaData":{"title":"Logmaxing API","description":"Training Science API"}}'
		></div>
		<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
		<script>
			// Hide all "Ask AI" buttons once Scalar renders
			const observer = new MutationObserver(() => {
				document.querySelectorAll('button, a, [role="button"]').forEach((el) => {
					if (el.textContent.trim().toLowerCase().includes('ask ai')) {
						el.style.display = 'none';
					}
				});
			});
			observer.observe(document.body, { childList: true, subtree: true });
		</script>
	</body>
</html>
