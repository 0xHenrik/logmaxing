<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>API Documentation | Logmaxing</title>
		<style>
			body {
				margin: 0;
				padding: 0;
			}
			/* Hide Scalar branding and cloud features */
			.scalar-command-palette,
			[data-scalar-activate],
			.scalar-api-reference__footer,
			.publish-button,
			a[href*="scalar.com"] {
				display: none !important;
			}
		</style>
	</head>
	<body>
		<div
			id="api-reference"
			data-url="/api/openapi.json"
			data-configuration='{"theme":"purple","layout":"modern","darkMode":true,"hideDarkModeToggle":true,"showSidebar":true,"hideDownloadButton":true,"hideModels":false,"hideClientButton":false,"defaultHttpClient":{"targetKey":"javascript","clientKey":"fetch"},"metaData":{"title":"Logmaxing API","description":"Training Science API"},"searchHotKey":"s"}'
		></div>
		<script
			src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.25.62"
			crossorigin="anonymous"
		></script>
		<script>
			// Hide Scalar cloud features (Ask AI, Publish, branding links)
			const hide = [/ask ai/i, /publish/i, /powered by/i, /scalar\.com/i];
			const observer = new MutationObserver(() => {
				document.querySelectorAll('button, a, [role="button"], [role="menuitem"]').forEach((el) => {
					const text = el.textContent.trim();
					const href = el.getAttribute('href') || '';
					if (hide.some((r) => r.test(text) || r.test(href))) {
						el.style.display = 'none';
					}
				});
			});
			observer.observe(document.body, { childList: true, subtree: true });
		</script>
	</body>
</html>
